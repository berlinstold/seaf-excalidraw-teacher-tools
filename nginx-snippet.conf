# =============================================================================
# Manuelle Installation: Ergänzungen für seafile.nginx.conf
# Seafile 13: meist /etc/nginx/sites-enabled/seafile.nginx.conf im Container,
# ältere Images: /shared/nginx/conf/seafile.nginx.conf (im Datenvolume).
# Welche Datei es ist: ./install.sh diagnose <container>
# =============================================================================

# --- (1) NEUER Block innerhalb von "server { ... }", z. B. direkt vor "location / {" ---

    # >>> EXCALIDRAW-TIMER (Plugin-Dateien) >>>
    location /seafile-plugins/ {
        alias /shared/plugins/;
        add_header Cache-Control "no-cache";
    }
    # <<< EXCALIDRAW-TIMER <<<


# --- (2) Diese Zeilen an den ANFANG des bestehenden "location / { ... }" einfügen ---

        # >>> EXCALIDRAW-TIMER (Skript einbinden) >>>
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '</head>' '<script src="/seafile-plugins/excalidraw-timer.js?v=1.0.0" defer></script></head>';
        # <<< EXCALIDRAW-TIMER <<<


